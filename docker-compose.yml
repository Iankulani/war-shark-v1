# ==============================================================================
# WAR-SHARK-v1 - Docker Compose Configuration
# Author: Ian Carter Kulani
# Version: 1.0.0
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # WAR-SHARK Main Service
  # ----------------------------------------------------------------------------
  war-shark:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "1.0.0"
        BUILD_DATE: "${BUILD_DATE:-}"
        VCS_REF: "${VCS_REF:-}"
    image: warshark/war-shark:1.0.0
    container_name: war-shark
    hostname: war-shark
    restart: unless-stopped
    
    ports:
      - "5000:5000"    # Web Dashboard
      - "8080:8080"    # Phishing Server
      - "4444:4444"    # Metasploit Handler
      - "5555:5555"    # Agent C2 Server
    
    volumes:
      - warshark-config:/root/.war_shark
      - warshark-reports:/opt/war-shark/reports
      - warshark-logs:/opt/war-shark/logs
      - ./wordlists:/opt/war-shark/wordlists:ro
    
    environment:
      - TZ=UTC
      - WARSHARK_VERSION=1.0.0
      - WARSHARK_DEBUG=false
      - WARSHARK_LOG_LEVEL=INFO
      - WARSHARK_WEB_ENABLED=true
      - WARSHARK_WEB_PORT=5000
      - WARSHARK_WEB_HOST=0.0.0.0
      - WARSHARK_API_KEY=${WARSHARK_API_KEY:-}
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
    
    networks:
      - warshark-net
    
    # Security options
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    
    security_opt:
      - no-new-privileges:false
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
    # Health check
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:5000/api/stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Redis Cache (Optional)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: war-shark-redis
    hostname: redis
    restart: unless-stopped
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis-data:/data
    
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-warshark}
    
    networks:
      - warshark-net
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Optional)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: war-shark-postgres
    hostname: postgres
    restart: unless-stopped
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-warshark}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-warshark}
      - POSTGRES_DB=${POSTGRES_DB:-warshark}
      - PGDATA=/var/lib/postgresql/data/pgdata
    
    networks:
      - warshark-net
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warshark}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy (Optional)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: war-shark-nginx
    hostname: nginx
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    
    depends_on:
      - war-shark
    
    networks:
      - warshark-net
    
    profiles:
      - with-nginx

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  warshark-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  warshark-config:
    driver: local
  warshark-reports:
    driver: local
  warshark-logs:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  nginx-logs:
    driver: local
